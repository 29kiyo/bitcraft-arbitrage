name: Delete Old Workflow Runs

on:
  workflow_dispatch: # 手動実行ボタンを有効化

permissions:
  actions: write

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2.0.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 1          # 直近3日間に実行された履歴は残す
          keep_minimum_runs: 5    # 最新の5件の履歴は必ず残す
          
          # 👇 正しい記述に修正（Update Arbitrage Dataワークフローのみを指定）
          delete_workflow_pattern: "Update Arbitrage Data"
          
          # 👇 正しい記述に修正（成功「success」とキャンセル「cancelled」を削除対象に指定）
          # ※これにより失敗「failure」は自動的にスキップされ、残ります。
          delete_run_by_conclusion_pattern: "success,cancelled"
